name: Check Strato access

# Logs in to Strato and lists the top folder. Reads only; changes nothing on the server.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ vars.STRATO_SFTP_HOST || '57190899.ssh.w1.strato.hosting' }}
      REMOTE_DIR: ${{ vars.STRATO_REMOTE_DIR || '/' }}
      SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      LFTP_SETTINGS: set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5
    steps:
      - name: Check the secrets are set
        run: |
          missing=0
          [ -n "$SFTP_USER" ] || { echo "::error::The STRATO_SFTP_USER secret is missing or empty"; missing=1; }
          [ -n "$SFTP_PASSWORD" ] || { echo "::error::The STRATO_SFTP_PASSWORD secret is missing or empty"; missing=1; }
          [ -n "$CONTACT_EMAIL" ] || { echo "::error::The CONTACT_EMAIL secret is missing or empty"; missing=1; }
          exit $missing

      # GitHub's runners have no IPv6, and Strato only accepts SFTP over IPv6 for this host.
      # Cloudflare WARP gives the runner an IPv6 route; the SFTP session itself stays end-to-end encrypted.
      - name: Get an IPv6 connection
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status
          curl -6 -s --max-time 10 https://ifconfig.co || echo "no IPv6 yet"

      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Show the SSH handshake (diagnostic, no password sent)
        continue-on-error: true
        run: |
          timeout 45 ssh -vv -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 "$SFTP_USER@$HOST" exit 2>&1 | grep -v -i -E 'identity file|load_hostkeys|kex_input|expecting|SSH2_MSG' | tail -40 || true

      - name: Log in and list the web folder
        run: |
          getent ahosts "$HOST" | awk '{print $1}' | sort -u
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$HOST" -e "$LFTP_SETTINGS; cls -1 -s -h '$REMOTE_DIR'; du -hs '$REMOTE_DIR'; bye"
