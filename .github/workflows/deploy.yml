name: Deploy to Strato

# Runs only when started by hand (Actions tab > Deploy to Strato > Run workflow),
# so nothing goes live without an explicit go-ahead.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to upload the site to leanig.nl'
        required: true

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.STRATO_SFTP_HOST || '57190899.swh.strato-hosting.eu' }}
      REMOTE_DIR: ${{ vars.STRATO_REMOTE_DIR || '/' }}
      SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      LFTP_SETTINGS: set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=0
          [ -n "$SFTP_USER" ] || { echo "::error::The STRATO_SFTP_USER secret is missing or empty"; missing=1; }
          [ -n "$SFTP_PASSWORD" ] || { echo "::error::The STRATO_SFTP_PASSWORD secret is missing or empty"; missing=1; }
          [ -n "$CONTACT_EMAIL" ] || { echo "::error::The CONTACT_EMAIL secret is missing or empty"; missing=1; }
          exit $missing

      - name: Fill in the contact form address
        run: |
          sed -i "s|__CONTACT_EMAIL__|$CONTACT_EMAIL|" site/contact.php

      # GitHub's runners have no IPv6, and Strato only accepts SFTP over IPv6 for this host.
      # Cloudflare WARP gives the runner an IPv6 route; the SFTP session itself stays end-to-end encrypted.
      - name: Get an IPv6 connection
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status
          curl -6 -s --max-time 10 https://ifconfig.co || echo "no IPv6 yet"

      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      # lftp retries a failed login forever by default, so fail fast and show what is on the server.
      - name: Check the Strato login
        timeout-minutes: 3
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$HOST" -e "$LFTP_SETTINGS; cls -1 '$REMOTE_DIR'; bye"

      - name: Back up what is on the server now
        timeout-minutes: 45
        run: |
          mkdir -p backup
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$HOST" -e "$LFTP_SETTINGS; mirror --parallel=8 --verbose=1 '$REMOTE_DIR' backup; bye"
          du -sh backup

      # The repository is public, so the backup is encrypted with the SFTP password
      # before it is stored (it can contain WordPress settings such as database passwords).
      - name: Encrypt the backup
        run: tar czf - backup | openssl enc -aes-256-cbc -pbkdf2 -pass env:SFTP_PASSWORD -out strato-backup.tar.gz.enc

      - name: Store the backup with this run
        uses: actions/upload-artifact@v4
        with:
          name: strato-backup-${{ github.run_number }}
          path: strato-backup.tar.gz.enc
          retention-days: 90

      - name: Upload the new site
        timeout-minutes: 10
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$HOST" -e "$LFTP_SETTINGS; mirror --reverse --verbose site '$REMOTE_DIR'; bye"
