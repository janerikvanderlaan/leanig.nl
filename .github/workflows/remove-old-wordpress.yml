name: Remove old WordPress folder

# One-off clean-up, started by hand. Backs up /WordPress_01 (encrypted), checks the
# backup is complete and can be decrypted, and only then deletes the folder on Strato.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to back up and then remove /WordPress_01'
        required: true
      already_backed_up:
        description: 'Skip the backup because an earlier run already stored one (wordpress-backup)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  remove:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.STRATO_SFTP_HOST || '57190899.ssh.w1.strato.hosting' }}
      OLD_DIR: /WordPress_01
      SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
      LFTP_SETTINGS: set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5
    steps:
      - name: Check the secrets are set
        run: |
          [ -n "$SFTP_USER" ] && [ -n "$SFTP_PASSWORD" ] || { echo "::error::Strato secrets missing"; exit 1; }

      # Never delete the folder the live site is served from.
      - name: Check leanig.nl is served by the new site
        run: |
          curl -fsS https://leanig.nl/ | grep -q 'contact-form' || { echo "::error::leanig.nl does not look like the new site"; exit 1; }
          if curl -fsS -o /dev/null https://leanig.nl/wp-login.php; then echo "::error::leanig.nl still serves WordPress"; exit 1; fi

      - name: Get an IPv6 connection
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp lftp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status

      # lftp exits non-zero when any transfer fails, and the log is checked for errors too,
      # so a partial download stops the run before anything is deleted.
      - name: Check an earlier backup is stored
        if: ${{ inputs.already_backed_up }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wordpress-backup" --jq '[.artifacts[] | select(.expired == false)] | length')
          [ "$n" -gt 0 ] || { echo "::error::No stored wordpress-backup found, nothing deleted"; exit 1; }

      - name: Back up the WordPress folder
        if: ${{ !inputs.already_backed_up }}
        timeout-minutes: 90
        run: |
          mkdir -p backup
          status=0
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$HOST" -e "$LFTP_SETTINGS; mirror --parallel=8 --verbose=1 '$OLD_DIR' backup/WordPress_01; bye" > mirror.log 2>&1 || status=$?
          grep -v '^Transferring file' mirror.log || true
          [ "$status" = 0 ] || { echo "::error::Download failed (lftp exit $status), nothing deleted"; exit 1; }
          du -sh backup

      - name: Check the backup is complete
        if: ${{ !inputs.already_backed_up }}
        run: |
          if grep -vE '^(Transferring file|Making directory) ' mirror.log | grep -iE 'error|failed|denied|cannot'; then echo "::error::Errors during download, nothing deleted"; exit 1; fi
          for f in wp-config.php wp-content wp-includes wp-admin index.php; do
            [ -e "backup/WordPress_01/$f" ] || { echo "::error::$f missing from backup, nothing deleted"; exit 1; }
          done
          echo "files in backup: $(find backup -type f | wc -l)"

      # The repository is public, so the backup is encrypted (it holds wp-config.php with database passwords).
      - name: Encrypt the backup and test that it decrypts
        if: ${{ !inputs.already_backed_up }}
        run: |
          tar czf - backup | openssl enc -aes-256-cbc -pbkdf2 -pass env:SFTP_PASSWORD -out wordpress-backup.tar.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SFTP_PASSWORD -in wordpress-backup.tar.gz.enc | tar tzf - | grep -q 'wp-config.php'
          ls -lh wordpress-backup.tar.gz.enc

      - name: Store the backup with this run
        if: ${{ !inputs.already_backed_up }}
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-backup
          path: wordpress-backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

      # SFTP deletes one file at a time, so the big subfolders are removed in parallel first.
      - name: Delete the WordPress folder on Strato
        timeout-minutes: 120
        run: |
          lftp_do() { lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$HOST" -e "$LFTP_SETTINGS; $1; bye"; }
          export -f lftp_do
          for parent in wp-content/plugins wp-content/themes wp-content/uploads wp-content wp-includes wp-admin; do
            lftp_do "cls -1 '$OLD_DIR/$parent/'" 2>/dev/null | sed 's|/$||' | grep -v '^$' > entries.txt || true
            echo "$parent: $(wc -l < entries.txt) entries"
            sed "s|^|$OLD_DIR/$parent/|; s|^$OLD_DIR/$parent/$OLD_DIR/|$OLD_DIR/|" entries.txt | xargs -r -P 8 -I{} bash -c 'lftp_do "rm -r -f \"{}\""'
          done
          lftp_do "rm -r -f '$OLD_DIR'"
          lftp_do "cls -1 /" | tee root.txt
          ! grep -q 'WordPress_01' root.txt || { echo "::error::WordPress_01 is still there"; exit 1; }

      - name: Check the live site still works
        run: curl -fsS https://leanig.nl/ | grep -q 'contact-form'
